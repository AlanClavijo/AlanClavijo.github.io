<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Alta Calidad Estilo Neon Blue & Slate -->
    <linearGradient id="acBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="acBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151822"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>

    <linearGradient id="acGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="acBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Hexagonal Externa -->
  <polygon points="250,20 450,135 450,365 250,480 50,365 50,135" fill="url(#acBgGrad)" stroke="url(#acBlueGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Hexágono Interior Fino de Acento -->
  <polygon points="250,38 430,143 430,357 250,462 70,357 70,143" fill="none" stroke="url(#acGlowGrad)" stroke-width="3" opacity="0.5" stroke-linejoin="round"/>

  <!-- Cursor de Ratón Vectorial Nítido con Rayo de Velocidad -->
  <g filter="url(#acBlueGlow)">
    <!-- Cursor Arrow -->
    <path d="M 210,120 L 320,270 L 260,260 L 290,340 L 255,355 L 225,275 L 175,310 Z" fill="url(#acBlueGrad)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <!-- Lightning Pulse Line -->
    <path d="M 290,140 L 320,175 L 295,190 L 340,240" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Puntos de Conexión / Clics en Tiempo Real -->
  <circle cx="210" cy="120" r="8" fill="#38BDF8"/>
  <circle cx="340" cy="240" r="6" fill="#60A5FA"/>

  <!-- Texto Principal AUTO CLICKER en Tipografía Vectorial Nítida -->
  <text x="250" y="415" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="6">AUTOCLICKER</text>
  <text x="250" y="442" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#38BDF8" letter-spacing="8">PRO UTILITY</text>
</svg>
